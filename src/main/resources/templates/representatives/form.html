<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${representative.repId == null}
                    ? 'CommissionFlow | Add Representative'
                    : 'CommissionFlow | Edit Representative'">
        CommissionFlow | Representative
    </title>
    
    <!-- Favicon -->
	<link rel="icon" type="image/x-icon" th:href="@{/images/logo.ico}">

    <link rel="stylesheet"
          th:href="@{/css/SidebarStyle.css}">

    <link rel="stylesheet"
          th:href="@{/css/RepresentativeFormStyle.css}">

    <link rel="stylesheet"
          th:href="@{/css/FooterStyle.css}">
          
          	<link rel="stylesheet"
	  	href="https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-straight/css/uicons-regular-straight.css">
	
	<link rel="stylesheet"
	      href="https://cdn-uicons.flaticon.com/3.0.0/uicons-thin-straight/css/uicons-thin-straight.css">
	
	<link rel="stylesheet"
	      href="https://cdn-uicons.flaticon.com/3.0.0/uicons-thin-rounded/css/uicons-thin-rounded.css">

</head>

<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>


<div class="page-container">

    <main class="form-page-content">


        <!-- HEADER -->

        <header class="page-header">

            <div>

                <p class="page-label"
                   th:text="${representative.repId == null}
                            ? 'NEW REPRESENTATIVE'
                            : 'EDIT REPRESENTATIVE'">
                    NEW REPRESENTATIVE
                </p>


                <h1 th:text="${representative.repId == null}
                             ? 'Add Representative'
                             : 'Edit Representative'">
                    Add Representative
                </h1>


                <p class="page-description"
                   th:text="${representative.repId == null}
                            ? 'Register a new sales representative in CommissionFlow.'
                            : 'Update the information of the selected sales representative.'">

                    Register a new sales representative in CommissionFlow.

                </p>

            </div>


            <a th:href="${returnUrl}"
			   class="back-button">
			    ← Back
			</a>

        </header>


        <!-- FORM CARD -->

        <section class="form-card">


            <div class="form-card-header">

                <div class="form-icon">
                    <i class="fi fi-ts-employee-man-alt"></i>
                </div>

                <div>

                    <h2>
                        Representative Information
                    </h2>

                    <p>
                        Enter the representative's basic information.
                    </p>

                </div>

            </div>


            <form th:action="@{/representatives/save}"
                  th:object="${representative}"
                  method="post"
                  class="representative-form">


                <!-- Needed for edit -->

                <input type="hidden"
                       th:field="*{repId}">


                <!-- FULL NAME -->

                <div class="form-group">

                    <label for="fullName">
                        Full Name
                        <span class="required">*</span>
                    </label>

                    <input type="text"
                           id="fullName"
                           th:field="*{fullName}"
                           placeholder="e.g. Apostolos Zarras"
                           required>

                    <span class="field-hint">
                        Enter the representative's first and last name.
                    </span>

                </div>


                <!-- VAT NUMBER -->

                <div class="form-group">

                    <label for="vatNumber">
                        VAT Number
                        <span class="required">*</span>
                    </label>

                    <input type="text"
                           id="vatNumber"
                           th:field="*{vatNumber}"
                           placeholder="e.g. 130456093"
                           required>

                    <span class="field-hint">
                        Tax identification number of the representative.
                    </span>

                </div>


                <!-- ACTIONS -->

                <div class="form-actions">


                    <a th:href="${returnUrl}"
					   class="cancel-button">
					    Cancel
					</a>


                    <button type="submit"
                            class="save-button">

                        <span th:text="${representative.repId == null}
                                       ? 'Add Representative'
                                       : 'Save Changes'">
                            Add Representative
                        </span>

                    </button>

                </div>

            </form>

        </section>

    </main>


    <div th:replace="~{fragments/footer :: footer}"></div>

</div>

</body>
</html>
